name: Build and Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Release Title'
        required: false
        default: 'Kaachu Phool Android APK'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore Signing Keystore and Secrets
        run: |
          # 1. Restore release keystore if base64 secret exists
          if [ ! -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> $GITHUB_ENV
          else
            # Fallback for debug/development if no release secret
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > release.keystore
            else
              keytool -genkey -v -keystore release.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
            fi
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=androiddebugkey" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

          # 2. Ensure .env exists to prevent missing secrets file warnings
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Build Signed Release APK
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'androiddebugkey' }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'android' }}
        run: |
          # Extract version from app/build.gradle.kts
          BASE_VERSION=$(grep "versionName =" app/build.gradle.kts | awk -F'"' '{print $(NF-1)}')
          VERSION_CODE=$(grep "versionCode =" app/build.gradle.kts | awk '{print $NF}')
          
          # Fallbacks if extraction fails
          if [ -z "$BASE_VERSION" ]; then BASE_VERSION="1.1.1"; fi
          if [ -z "$VERSION_CODE" ]; then VERSION_CODE="111"; fi
          
          # Append run number to ensure uniqueness and "it continues"
          VERSION_NAME="${BASE_VERSION}.${{ github.run_number }}"
          
          echo "Building version $VERSION_NAME ($VERSION_CODE)"
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease -PversionName=$VERSION_NAME -PversionCode=$VERSION_CODE --no-daemon --no-configuration-cache --stacktrace
          else
            gradle assembleRelease -PversionName=$VERSION_NAME -PversionCode=$VERSION_CODE --no-daemon --no-configuration-cache --stacktrace
          fi

      - name: Locate Generated APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No Release APK found!"
            # Fallback to debug if release build failed to produce file for some reason
            APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK found!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaachu-phool-release-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: v${{ env.VERSION_NAME }}
          name: ${{ github.event.inputs.release_title || format('Kaachu Phool Build v{0}', env.VERSION_NAME) }}
          files: ${{ steps.find_apk.outputs.apk_path }}
          draft: false
          prerelease: false
          generate_release_notes: true
