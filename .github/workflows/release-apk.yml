name: Build and Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Release Title'
        required: false
        default: 'Kaachu Phool Android APK'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Restore Signing Keystore and Secrets
        env:
          EMBEDDED_KEYSTORE_B64: ""
        run: |
          # 1. Restore release keystore:
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Restoring from secret RELEASE_KEYSTORE_BASE64..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.RELEASE_KEYSTORE_PASSWORD || 'android' }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS || 'androiddebugkey' }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD || 'android' }}" >> $GITHUB_ENV
          elif [ -f "keystore/release.keystore" ]; then
            echo "Restoring from keystore/release.keystore..."
            cp keystore/release.keystore release.keystore
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=androiddebugkey" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          elif [ -f "keystore/release.keystore.base64" ]; then
            echo "Restoring from keystore/release.keystore.base64..."
            base64 -d keystore/release.keystore.base64 > release.keystore
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=androiddebugkey" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          elif [ -f "app/release.keystore" ]; then
            echo "Restoring from app/release.keystore..."
            cp app/release.keystore release.keystore
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=androiddebugkey" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          elif [ -f "app/release.keystore.base64" ]; then
            echo "Restoring from app/release.keystore.base64..."
            base64 -d app/release.keystore.base64 > release.keystore
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=androiddebugkey" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          elif [ -f "debug.keystore.base64" ]; then
            echo "Restoring from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > release.keystore
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=androiddebugkey" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          elif [ -f "debug.keystore" ]; then
            echo "Restoring from debug.keystore..."
            cp debug.keystore release.keystore
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=androiddebugkey" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          else
            echo "Restoring from embedded permanent keystore..."
            echo "$EMBEDDED_KEYSTORE_B64" | base64 -d > release.keystore
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=androiddebugkey" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

          # 2. Ensure .env exists to prevent missing secrets file warnings
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Validate Gradle Wrapper
        run: |
          echo "Validating presence of gradlew executable..."
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found! Generating wrapper..."
            gradle wrapper --gradle-version 9.3.1
          fi

          if [ ! -f "./gradlew" ]; then
            echo "Error: gradlew executable could not be found or generated!"
            exit 1
          fi

          echo "Setting execution permissions for gradlew..."
          chmod +x ./gradlew

          if [ ! -x "./gradlew" ]; then
            echo "Error: gradlew is not executable after chmod!"
            exit 1
          fi

          echo "Confirmed gradlew presence and permissions:"
          ls -l ./gradlew
          ./gradlew --version

      - name: Build Signed Release APK
        run: |
          # Extract version from app/build.gradle.kts
          BASE_VERSION=$(grep "versionName =" app/build.gradle.kts | awk -F'"' '{print $(NF-1)}')
          BASE_CODE=$(grep "versionCode =" app/build.gradle.kts | awk '{print $NF}' | tr -cd '[0-9]')
          
          # Fallbacks if extraction fails
          if [ -z "$BASE_VERSION" ]; then BASE_VERSION="1.1.1"; fi
          if [ -z "$BASE_CODE" ]; then BASE_CODE=111; fi
          
          # Strictly increasing version code for Android package manager updates
          VERSION_CODE=$(( BASE_CODE * 1000 + ${{ github.run_number }} ))
          VERSION_NAME="${BASE_VERSION}.${{ github.run_number }}"
          
          echo "Building version $VERSION_NAME ($VERSION_CODE)"
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease -PversionName=$VERSION_NAME -PversionCode=$VERSION_CODE --no-daemon --no-configuration-cache --stacktrace
          else
            gradle assembleRelease -PversionName=$VERSION_NAME -PversionCode=$VERSION_CODE --no-daemon --no-configuration-cache --stacktrace
          fi

      - name: Locate Generated APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No Release APK found!"
            # Fallback to debug if release build failed to produce file for some reason
            APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK found!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaachu-phool-release-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: v${{ env.VERSION_NAME }}
          name: ${{ github.event.inputs.release_title || format('Kaachu Phool Build v{0}', env.VERSION_NAME) }}
          files: ${{ steps.find_apk.outputs.apk_path }}
          draft: false
          prerelease: false
          generate_release_notes: true
